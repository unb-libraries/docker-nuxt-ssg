# Whole-file override of $NGINX_APP_CONF_FILE, not a $NGINX_CONFD_DIR/server/*.conf
# snippet: the parent includes snippets before its own `location /`, and redefining that
# stops nginx starting. UPPERCASE placeholders are substituted at container start.

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 30;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  include NGINX_CONFD_SLUG/daemon/*.conf;

  server {
    listen 80 default_server;
    charset utf-8;
    server_name APP_HOSTNAME;

    root APP_WEBROOT;
    index index.html index.htm;

    access_log NGINX_LOG_FILE;
    error_log NGINX_ERROR_LOG_FILE warn;

    # Probe target for unblib-daemon-nuxt-ssg, independent of try_files on purpose.
    location = /health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    include NGINX_CONFD_SLUG/server/*.conf;

    # Not the parent's /index.html fallback, which answers dead links with a soft 200.
    location / {
      try_files $uri $uri.html $uri/index.html =404;
      # Stale HTML would request /_nuxt/ hashes a later deploy has purged.
      add_header Cache-Control "public, no-cache" always;
    }

    error_page 404 /404.html;
    location = /404.html {
      internal;
    }

    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
      add_header Cache-Control "public, max-age=2592000, immutable" always;
      access_log off;
    }

    # Deny . (dot) file access
    location ~ (^|/)\. {
      return 403;
    }
  }
}
